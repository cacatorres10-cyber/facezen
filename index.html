<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FaceZen</title>
    <meta name="description" content="Yoga facial e skincare consciente em 10 minutos, personalizado para você." />
    <meta name="theme-color" content="#1F5A4E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FaceZen" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica o tema salvo antes do primeiro paint (evita "piscar").
      try {
        var raw = localStorage.getItem('facezen:v1');
        var theme = raw && JSON.parse(raw).state.settings.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
