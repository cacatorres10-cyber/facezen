name: Baixar aulas em vídeo

# Baixa as aulas em vídeo do YouTube (vídeos da própria autora, "Não listado"),
# reduz para 480p e guarda como arquivo do workflow, para a prévia do app.
on:
  workflow_dispatch:

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q yt-dlp
      - name: Baixar e reduzir
        run: |
          mkdir -p saida
          for id in $(grep -oE "youtu\.be/[A-Za-z0-9_-]{11}" src/content/videoLessons.ts | cut -d/ -f2); do
            yt-dlp -q --no-warnings -f "bv*[height<=480]+ba/b[height<=480]/b" -o "bruto/$id.%(ext)s" "https://www.youtube.com/watch?v=$id" || { echo "falhou $id"; continue; }
            f=$(ls bruto/$id.* | head -1)
            ffmpeg -v error -y -i "$f" -vf "scale=-2:480" -c:v libx264 -preset slow -crf 30 -profile:v main -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 64k "saida/$id.mp4"
            ls -la "saida/$id.mp4"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aulas-video
          path: saida/
          retention-days: 7
