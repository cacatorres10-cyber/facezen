name: Atualizar fotos

# Baixa as fotos do Pexels para dentro do repositório,
# para o app funcionar offline e sem depender de links externos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  midia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fotos do Pexels
        run: python3 scripts/baixar_midia.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets
          git diff --cached --quiet || git commit -m "Atualiza fotos"
          git push
